<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00864a"/>
      <stop offset="100%" stop-color="#005a31"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded emerald background container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg-grad)" />

  <!-- Graduation Cap Icon Top -->
  <path d="M256 100 L400 170 L256 240 L112 170 Z" fill="#ffffff" opacity="0.95" />
  <path d="M142 195 V255 C142 275 190 300 256 300 C322 300 370 275 370 255 V195" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Tassel -->
  <path d="M375 185 V260" stroke="#facc15" stroke-width="12" stroke-linecap="round"/>
  <circle cx="375" cy="268" r="10" fill="#facc15"/>

  <!-- Bold 'M' for MCQs Knowledge with checkmark integrated -->
  <path d="M140 410 V340 L195 395 L256 330 L317 395 L372 340 V410" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Success Badge Checkmark -->
  <circle cx="390" cy="140" r="36" fill="#facc15"/>
  <path d="M375 140 L386 151 L407 130" fill="none" stroke="#005a31" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
