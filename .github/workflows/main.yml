name: Daily MCQ Scraper

on:
  schedule:
    # Runs daily at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Scraper & Deduplication
        env:
          MAX_PAGES: '10'
        run: |
          python scripts/scrape_all_mcqs.py

      - name: Commit and Push Updated Dataset
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/lib/db.ts scraper-data/mcqs.json
          if git diff --staged --quiet; then
            echo "No changes to commit. Dataset is up to date."
          else
            git commit -m "chore: daily update scraped MCQs dataset [skip ci]"
            git push
          fi
