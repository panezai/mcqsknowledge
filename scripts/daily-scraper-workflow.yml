name: Daily MCQ Scraper

on:
  schedule:
    # Run daily at 02:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Scraper & Deduplication
        env:
          MAX_PAGES: '10'
        run: |
          python scripts/scrape_all_mcqs.py

      - name: Commit and Push Updated Dataset
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/lib/db.ts scraper-data/mcqs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: daily update scraped MCQs dataset" && git push)
